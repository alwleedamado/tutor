[package]
name = "rust-mastery-offline"
version = "1.0.0"
description = "Fully offline learning environment for Rust, Vue 3 and Tauri"
authors = ["Rust Mastery Offline"]
edition = "2021"

[lib]
name = "rust_mastery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rust-mastery-offline"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
include_dir = "0.7"
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 16
lto = false
