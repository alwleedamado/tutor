name: Release

# Builds desktop installers for macOS, Linux and Windows and publishes them
# to a GitHub Release.
#
# Trigger: push a tag matching the app version in src-tauri/tauri.conf.json
# (e.g. version "1.0.0" -> tag "v1.0.0"). `workflow_dispatch` builds the same
# release for the version in tauri.conf.json without needing a tag.
#
# Signing: builds are unsigned. macOS shows a Gatekeeper prompt (right-click
# -> Open, or `xattr -cr <app>`); Windows may show a SmartScreen warning.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies (WebKitGTK, tray, bundler tools)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # __VERSION__ is substituted from src-tauri/tauri.conf.json, so the
          # release tag always matches the app version.
          tagName: v__VERSION__
          releaseName: 'Rust Mastery Offline v__VERSION__'
          releaseBody: |
            Fully offline desktop learning environment for Rust, Vue 3 and Tauri v2.

            Downloads:
            - Windows: `.msi` (installer) / `.exe` (setup)
            - macOS: `.dmg`
            - Linux: `.deb` / `.rpm` / `.appimage`

            Builds are unsigned — see the release notes/README for first-run hints.
          releaseDraft: false
          prerelease: false

      - name: Upload build artifacts (workflow archive)
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: ignore
